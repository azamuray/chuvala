<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт привязан - Chuvala ID</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
        }
        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .success-icon {
            width: 64px;
            height: 64px;
            background: #d1fae5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .success-icon svg {
            color: var(--success);
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 1rem 0;
            color: var(--success);
        }
        .info {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .accounts {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .account-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.875rem;
        }
        .account-label {
            color: var(--text-muted);
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: var(--success);
            color: white;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="success-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 6L9 17l-5-5"/>
            </svg>
        </div>

        <h1>Аккаунт привязан!</h1>

        <p class="info">
            Теперь можешь записывать расходы через Telegram-бота,
            и они будут видны на сайте Damdac.
        </p>

        <div class="accounts">
            <div class="account-row">
                <span class="account-label">Email:</span>
                <span>{{ email }}</span>
            </div>
            <div class="account-row">
                <span class="account-label">Telegram:</span>
                <span>@{{ telegram_username }}</span>
            </div>
        </div>

        <a href="https://damdac.ru" class="btn">Перейти в Damdac</a>
    </div>
</body>
</html>
